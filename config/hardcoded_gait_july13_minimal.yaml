version: 1
source:
  simulator: isaac_lab
  log: logs_sim/grallator_sim_motor_log_20260713_124106.csv
  fit: diagonal_symmetrized_fundamental_on_achieved_joint_positions
  note: >-
    Frequencies and coefficients were fitted to measured q, not the much larger
    actor targets. Hip targets are fixed at zero. Thigh and calf terms are
    symmetrized in physical leg coordinates so FL+BR and FR+BL alternate by
    exactly half a cycle. One fundamental is retained to avoid high-harmonic
    acceleration on hardware.
joint_order:
  - BL_hip_joint
  - BR_hip_joint
  - FL_hip_joint
  - FR_hip_joint
  - BL_thigh_joint
  - BR_thigh_joint
  - FL_thigh_joint
  - FR_thigh_joint
  - BL_calf_joint
  - BR_calf_joint
  - FL_calf_joint
  - FR_calf_joint
deployment_defaults:
  amplitude_scale: 0.50
  frequency_scale: 0.50
  direction_blend_seconds: 2.5
  max_target_step_rad: 0.025
  max_target_velocity_rad_s: 1.50
  max_target_acceleration_rad_s2: 10.0
  harmonic_weights: [1.0, 0.0, 0.0]
