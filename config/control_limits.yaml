# Runtime control limits and switches.
#
# Set enabled: false on a section to let the policy command through that soft
# limit layer. The hard joint limits in config/joint_limits.yaml are still
# enforced in the final MIT packet builder before anything is sent to motors.
# The joystick always owns commanded vx/vy/yaw. RobStride protocol packing still
# saturates to the physical protocol ranges in mit_motor_control.yaml.

velocity_command:
  enabled: true
  # Match the IsaacSim keyboard play command envelope. Joystick speed_scale
  # still keeps first tests slow, but the policy is no longer clipped to a
  # near-standing command before inference.
  vx_min: -1.80
  vx_max: 1.80
  vy_min: -0.80
  vy_max: 0.80
  yaw_min: -0.70
  yaw_max: 0.70

joystick_speed_scale:
  # Restrained mid-speed defaults. With keyboard W and max_vx=1.8, the
  # initial scale commands 0.18 m/s. Arrow keys may tune only inside this
  # deliberately narrow hardware-test envelope.
  initial: 0.10
  min: 0.06
  max: 0.16
  step: 0.02

policy_deployment:
  # These affect only the policy inference path. The joystick speed_scale still
  # limits the real commanded velocity, and config/joint_limits.yaml is still
  # the final hard wall before MIT packets are sent.
  command_gain: 1.0
  # Absolute caps after command_gain. Use 0.0 to disable a cap and match the
  # IsaacSim play script more directly.
  command_vx_abs_max: 0.0
  command_vy_abs_max: 0.0
  command_yaw_abs_max: 0.0
  # Normal policy outputs are below this value in the deployment preflight.
  # This catches an abnormal actor spike without clipping the checked gait.
  action_clip_abs: 4.0
  # Light recurrent smoothing damps one-frame action discontinuities while
  # retaining most of the current policy output on every 20 ms step.
  action_smoothing: 0.20
  # Ramp body commands before placing them in observations 9:12. These are
  # body-frame acceleration/yaw-acceleration limits per second.
  command_slew_vx_per_s: 0.60
  command_slew_vy_per_s: 0.40
  command_slew_yaw_per_s: 0.60
  # Blend from the held/standing target into the learned gait on every policy
  # entry. This prevents a key press from becoming a one-cycle target jump.
  transition_seconds: 0.40

joint_position:
  enabled: true

joint_rate:
  enabled: true

mit_parameters:
  enabled: true
  p_min: -12.5
  p_max: 12.5
  v_min: -30.0
  v_max: 30.0
  kp_min: 0.0
  # Startup sit/stand gains in config/mit_motor_control.yaml need headroom above
  # policy gains. Policy gains remain low because their configured values are
  # already below this cap.
  kp_max: 100.0
  kd_min: 0.0
  kd_max: 5.0
  tau_ff_min: -1.0
  tau_ff_max: 1.0

telemetry:
  compact_only: true
