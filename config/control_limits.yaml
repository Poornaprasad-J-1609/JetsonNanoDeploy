# Runtime control limits and switches.
#
# Set enabled: false on a section to let the policy command through that soft
# limit layer. Physical joint limits in config/joint_limits.yaml are always
# enforced in the safety filter and final MIT packet builder.
# The joystick always owns commanded vx/vy/yaw. RobStride protocol packing still
# saturates to the physical protocol ranges in mit_motor_control.yaml.

velocity_command:
  enabled: true
  # Match the IsaacSim keyboard play command envelope. Joystick speed_scale
  # still keeps first tests slow, but the policy is no longer clipped to a
  # near-standing command before inference.
  vx_min: -1.80
  vx_max: 1.80
  vy_min: -0.80
  vy_max: 0.80
  yaw_min: -0.80
  yaw_max: 0.80

joystick_speed_scale:
  # Ground walking needs enough commanded velocity for the trained trot phase to
  # appear. Start below the 08becfc hanging-test profile, then use up/down arrows
  # only after feedback age and trunk motion look stable.
  initial: 0.06
  min: 0.03
  max: 0.20
  step: 0.01

policy_deployment:
  # These affect only the policy inference path. The joystick speed_scale still
  # limits the real commanded velocity, and config/joint_limits.yaml is still
  # the final hard wall before MIT packets are sent.
  command_gain: 1.0
  # Absolute caps after command_gain. Use 0.0 to disable a cap and match the
  # IsaacSim play script more directly.
  # 0 disables the cap so obs[9:12] matches the sim keyboard command pipeline.
  command_vx_abs_max: 0.0
  command_vy_abs_max: 0.0
  command_yaw_abs_max: 0.0
  # Scale only the actor-produced offset from q_default. Never scale the
  # absolute target itself. Progress this value only after qualified trials.
  hardware_action_gain: 0.05
  # Ground-safe defaults: preserve the trained action_scale from joint_map.yaml,
  # but do not let the first walking key press jump straight from stand to a
  # full actor output. Use --policy-sim-match only for controlled comparisons.
  action_clip_abs: 2.8
  # The latest loaded-ground log drove raw hip actions to |8.33| while the
  # matching MuJoCo run stayed near |3.23| maximum. Keep hip target
  # contributions inside +/-0.40 rad without reducing thigh/calf gait range.
  hip_action_clip_abs: 1.6
  # Loaded hardware logs show 1.3x to 2.4x the simulated hip RMS despite
  # smaller targets. Apply this after the hip clip at the motor boundary; the
  # raw actor action still feeds obs[36:48] exactly as it did during training.
  hip_action_scale: 0.65
  action_smoothing: 0.20
  action_delta_limit_abs: 0.15
  policy_entry_ramp_seconds: 2.0
  # Before packing a walking MIT command, constrain its estimated joint-space
  # PD torque around fresh encoder feedback. The independent measured-feedback
  # emergency stop remains in config/safety_limits.yaml.
  # Safe suspension default. Do not raise this automatically; use
  # --policy-pd-torque-limit 18 only for the controlled comparison after routing
  # and IMU sign tests pass.
  estimated_pd_torque_limit: 14.0
  # Keep every joint at the same safe default unless an explicit hardware test
  # justifies a per-joint override.
  estimated_pd_torque_limits:
    BL_hip_joint: 14.0
    BR_hip_joint: 14.0
    FL_hip_joint: 14.0
    FR_hip_joint: 14.0
    BL_thigh_joint: 14.0
    BR_thigh_joint: 14.0
    FL_thigh_joint: 14.0
    FR_thigh_joint: 14.0
    BL_calf_joint: 14.0
    BR_calf_joint: 14.0
    FL_calf_joint: 14.0
    FR_calf_joint: 14.0

joint_position:
  enabled: true

joint_rate:
  enabled: true

mit_parameters:
  enabled: true
  # Zero disables host-side pose target/gain rewriting and restores the proven
  # e9a4a13 sit/stand/hold packet behavior. Independent measured torque,
  # position, velocity, tilt, and stale-feedback emergency checks remain on.
  startup_pd_torque_limit: 0.0
  sit_pd_torque_limit: 0.0
  stand_pd_torque_limit: 0.0
  hold_pd_torque_limit: 0.0
  leveling_pd_torque_limit: 20.0
  p_min: -12.566370614359172
  p_max: 12.566370614359172
  v_min: -15.0
  v_max: 15.0
  kp_min: 0.0
  # Accommodate the pre-SocketCAN effective gains in official RS04 units.
  kp_max: 800.0
  kd_min: 0.0
  kd_max: 40.0
  # Must accommodate virtual_joint_stop.max_preload_nm. Total estimated
  # position + damping + feedforward torque remains bounded independently by
  # the selected policy torque stage.
  tau_ff_min: -8.0
  tau_ff_max: 8.0

telemetry:
  compact_only: true
