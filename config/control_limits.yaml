# Runtime control limits and switches.
#
# Set enabled: false on a section to let the policy command through that soft
# limit layer. Physical joint limits in config/joint_limits.yaml are always
# enforced in the safety filter and final MIT packet builder.
# The joystick always owns commanded vx/vy/yaw. RobStride protocol packing still
# saturates to the physical protocol ranges in mit_motor_control.yaml.

velocity_command:
  enabled: true
  # Match the IsaacSim keyboard play command envelope. Joystick speed_scale
  # still keeps first tests slow, but the policy is no longer clipped to a
  # near-standing command before inference.
  vx_min: -1.80
  vx_max: 1.80
  vy_min: -0.80
  vy_max: 0.80
  yaw_min: -0.80
  yaw_max: 0.80

joystick_speed_scale:
  # Ground walking needs enough commanded velocity for the trained trot phase to
  # appear. Start below the 08becfc hanging-test profile, then use up/down arrows
  # only after feedback age and trunk motion look stable.
  initial: 0.06
  min: 0.03
  max: 0.20
  step: 0.01

policy_deployment:
  # These affect only the policy inference path. The joystick speed_scale still
  # limits the real commanded velocity, and config/joint_limits.yaml is still
  # the final hard wall before MIT packets are sent.
  command_gain: 1.0
  # Absolute caps after command_gain. Use 0.0 to disable a cap and match the
  # IsaacSim play script more directly.
  # 0 disables the cap so obs[9:12] matches the sim keyboard command pipeline.
  command_vx_abs_max: 0.0
  command_vy_abs_max: 0.0
  command_yaw_abs_max: 0.0
  # Match the broad upstream MEVIUS action clamp. For model 8675, target
  # conversion still uses its trained 0.25 scale from joint_map.yaml. Only the
  # stand-to-policy entry blend is rate limited; steady policy targets are not.
  action_clip_abs: 100.0
  hip_action_clip_abs: 0.0
  hip_action_scale: 1.0
  action_smoothing: 0.0
  action_delta_limit_abs: 0.0
  policy_entry_ramp_seconds: 3.0
  # Before packing a walking MIT command, retain one final estimated
  # joint-space authority ceiling around fresh encoder feedback. The
  # independent measured-feedback emergency stop remains in safety_limits.yaml.
  # Common requested torque ceiling for loaded sit, stand, hold, and walking.
  # This is an authority ceiling, not a continuously commanded torque.
  estimated_pd_torque_limit: 100.0
  estimated_pd_torque_limits:
    BL_hip_joint: 100.0
    BR_hip_joint: 100.0
    FL_hip_joint: 100.0
    FR_hip_joint: 100.0
    BL_thigh_joint: 100.0
    BR_thigh_joint: 100.0
    FL_thigh_joint: 100.0
    FR_thigh_joint: 100.0
    BL_calf_joint: 100.0
    BR_calf_joint: 100.0
    FL_calf_joint: 100.0
    FR_calf_joint: 100.0

joint_position:
  enabled: true

joint_rate:
  enabled: true

mit_parameters:
  enabled: true
  # Use the same authority ceiling for every phase. Pose and policy gains still
  # determine the actual torque, while independent feedback safety remains on.
  startup_pd_torque_limit: 100.0
  sit_pd_torque_limit: 100.0
  stand_pd_torque_limit: 100.0
  hold_pd_torque_limit: 100.0
  leveling_pd_torque_limit: 100.0
  p_min: -12.566370614359172
  p_max: 12.566370614359172
  v_min: -15.0
  v_max: 15.0
  kp_min: 0.0
  # Leave tuning room above the three shared gains without changing them.
  kp_max: 250.0
  kd_min: 0.0
  kd_max: 10.0
  # Packet-field bounds only. The MEVIUS-style profile sends tau_ff=0 and the
  # total estimated command authority remains bounded by 100 Nm.
  tau_ff_min: -50.0
  tau_ff_max: 50.0

telemetry:
  compact_only: true
