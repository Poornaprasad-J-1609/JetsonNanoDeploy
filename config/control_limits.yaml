# Runtime control limits and switches.
#
# Set enabled: false on a section to let the policy command through that soft
# limit layer. The hard joint limits in config/joint_limits.yaml are still
# enforced in the final MIT packet builder before anything is sent to motors.
# The joystick always owns commanded vx/vy/yaw. RobStride protocol packing still
# saturates to the physical protocol ranges in mit_motor_control.yaml.

velocity_command:
  enabled: true
  # Match the IsaacSim keyboard play command envelope. Joystick speed_scale
  # still keeps first tests slow, but the policy is no longer clipped to a
  # near-standing command before inference.
  vx_min: -1.80
  vx_max: 1.80
  vy_min: -0.80
  vy_max: 0.80
  yaw_min: -0.80
  yaw_max: 0.80

joystick_speed_scale:
  initial: 0.10
  min: 0.05
  max: 0.40
  step: 0.05

policy_deployment:
  # These affect only the policy inference path. The joystick speed_scale still
  # limits the real commanded velocity, and config/joint_limits.yaml is still
  # the final hard wall before MIT packets are sent.
  command_gain: 1.0
  # Absolute caps after command_gain. Use 0.0 to disable a cap and match the
  # IsaacSim play script more directly.
  command_vx_abs_max: 0.0
  command_vy_abs_max: 0.0
  command_yaw_abs_max: 0.0
  # The supplied IsaacLab logs use raw actions up to about 8.6, with roughly
  # 45% above 0.8. A 0.8 clip suppresses the learned gait. This middle profile
  # preserves over 96% of logged samples while the independent hard joint and
  # 40 Nm estimated-PD limits remain active.
  action_clip_abs: 3.0
  action_smoothing: 0.10
  # Blend from the settled stand pose into the first walking targets. This
  # prevents an immediate full-amplitude actor target when a movement key is
  # pressed while the robot is carrying its weight.
  policy_entry_ramp_seconds: 1.5
  # Before packing a walking MIT command, constrain its estimated joint-space
  # PD torque around fresh encoder feedback. The independent measured-feedback
  # emergency stop remains in config/safety_limits.yaml.
  # Keep the command-side estimate below the measured 40 Nm emergency guard,
  # while leaving enough target amplitude for the gait to appear.
  estimated_pd_torque_limit: 30.0

joint_position:
  enabled: true

joint_rate:
  enabled: true

mit_parameters:
  enabled: true
  # Zero disables target rewriting for pose/hold and reproduces the original
  # MIT behavior. Measured torque safety remains independently enforced.
  startup_pd_torque_limit: 0.0
  hold_pd_torque_limit: 0.0
  leveling_pd_torque_limit: 20.0
  p_min: -12.566370614359172
  p_max: 12.566370614359172
  v_min: -15.0
  v_max: 15.0
  kp_min: 0.0
  # Accommodate the pre-SocketCAN effective gains in official RS04 units.
  kp_max: 800.0
  kd_min: 0.0
  kd_max: 40.0
  tau_ff_min: -1.0
  tau_ff_max: 1.0

telemetry:
  compact_only: true
