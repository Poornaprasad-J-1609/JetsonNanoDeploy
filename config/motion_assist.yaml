# Small command-side helpers used after the policy target and before safety
# limits. Keep values conservative; joint_limits.yaml is still the hard stop.

imu_posture:
  # Adds a small roll/pitch correction from projected_gravity on top of stand
  # and policy targets. Disable with --no-imu-stabilization.
  enabled: false
  # A 5 degree tilt now requests about 0.031 rad of roll correction and
  # 0.026 rad of pitch correction. The previous values (0.010/0.007 rad)
  # were valid but too small to observe reliably on the real mechanism.
  roll_kp: 0.35
  pitch_kp: 0.30
  max_roll_correction: 0.12
  max_pitch_correction: 0.10

  # q += roll_gain * roll_correction + pitch_gain * pitch_correction
  # Signs are robot-calibration dependent. If tilt correction pushes the wrong
  # way, flip the corresponding signs here.
  joint_gains:
    FL_hip_joint: {roll: -1.0, pitch: 0.0}
    FR_hip_joint: {roll:  1.0, pitch: 0.0}
    BL_hip_joint: {roll: -1.0, pitch: 0.0}
    BR_hip_joint: {roll:  1.0, pitch: 0.0}

    FL_thigh_joint: {roll: 0.0, pitch: -1.0}
    FR_thigh_joint: {roll: 0.0, pitch: -1.0}
    BL_thigh_joint: {roll: 0.0, pitch:  1.0}
    BR_thigh_joint: {roll: 0.0, pitch:  1.0}

    FL_calf_joint: {roll: 0.0, pitch: -0.5}
    FR_calf_joint: {roll: 0.0, pitch: -0.5}
    BL_calf_joint: {roll: 0.0, pitch:  0.5}
    BR_calf_joint: {roll: 0.0, pitch:  0.5}

# Learned stand stabilization uses the difference between two policy passes:
# one with live IMU gyro/gravity and one with an upright, zero-gyro IMU. This
# cancels the policy's nonzero nominal stand action and retains only its learned
# IMU-dependent whole-leg response.
stand_policy_imu:
  gain: 1.0
  max_correction: 0.12

gait_assist:
  # Off by default. Enable with --gait-assist for suspended one/two-leg tests
  # when you want to see a walking-style swing even without full body dynamics.
  enabled: false
  frequency_hz: 1.0
  min_command: 0.03
  full_scale_command: 0.15
  thigh_amplitude: 0.18
  calf_amplitude: 0.25
  hip_amplitude: 0.03
