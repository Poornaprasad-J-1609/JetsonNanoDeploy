motor:
  model: rs-04
  use_official_mit_ranges: true
  # Use one physical RS04 unit contract in every phase. The legacy 9b03a77
  # range encoded Kp=75 and Kd=1.8 as approximately Kp=750 and Kd=36 when the
  # official motor decoded the packet, which caused pose vibration.
  command_encoding: official
  phase_command_encoding:
    startup: official
    hold: official
    policy: official
    leveling: official

legacy_command_protocol:
  use_float_to_uint: true
  p_min: -12.5
  p_max: 12.5
  v_min: -30.0
  v_max: 30.0
  kp_min: 0.0
  kp_max: 500.0
  kd_min: 0.0
  kd_max: 5.0
  tau_min: -12.0
  tau_max: 12.0

mit_protocol:
  # RobStride / CyberGear-style MIT control frame.
  # master_id is used only for filtering/diagnostics; operation-control
  # commands put feed-forward torque in the extended ID extra-data field.
  comm_type_mit_control: 1
  comm_type_feedback: 2
  comm_type_enable: 3
  comm_type_stop: 4
  comm_type_set_zero: 6
  comm_type_save_parameters: 22
  comm_type_active_feedback: 24
  # Host/controller ID used in RobStride management and polling frames.
  # This matches the working read_three_robstride_encoders.py script.
  master_id: 0xFD

  # Exact RS04 operation-control wire ranges from robstride_dynamics.
  p_min: -12.566370614359172
  p_max: 12.566370614359172
  v_min: -15.0
  v_max: 15.0
  kp_min: 0.0
  kp_max: 5000.0
  kd_min: 0.0
  kd_max: 100.0
  tau_min: -120.0
  tau_max: 120.0

startup:
  standup_seconds: 3.0

communication:
  # The old serial-AT backend uses this proven inter-packet gap. SocketCAN
  # bypasses it and lets the kernel serialize one compact 12-frame command set.
  batch_writes: false
  group_flush: true
  frame_gap_s: 0.0010

gains:
  # Values below are physical RS04 gains because every phase uses the official
  # operation-control range.
  startup:
    hip:
      kp: 80.0
      kd: 4.0
    thigh:
      # Loaded stand logs show stable feedback but persistent static sag at
      # Kp=110. Match the rear policy impedance without changing damping.
      kp: 130.0
      kd: 4.0
    calf:
      kp: 130.0
      kd: 4.0

  hold:
    hip:
      kp: 80.0
      kd: 4.0
    thigh:
      kp: 130.0
      kd: 4.0
    calf:
      kp: 130.0
      kd: 4.0

  policy:
    hip:
      # Restore the actuator impedance used by the comparatively successful
      # 0c17450 hardware run. Policy packets remain in official RS04 units.
      kp: 80.0
      kd: 5.0
    thigh:
      kp: 110.0
      kd: 6.5
    calf:
      kp: 110.0
      kd: 6.5
    joints:
      BL_hip_joint: {kp: 80.0, kd: 5.0}
      BR_hip_joint: {kp: 80.0, kd: 5.0}
      FL_hip_joint: {kp: 80.0, kd: 5.0}
      FR_hip_joint: {kp: 80.0, kd: 5.0}
      BL_thigh_joint: {kp: 130.0, kd: 8.0}
      BR_thigh_joint: {kp: 130.0, kd: 8.0}
      FL_thigh_joint: {kp: 110.0, kd: 6.5}
      FR_thigh_joint: {kp: 110.0, kd: 6.5}
      BL_calf_joint: {kp: 130.0, kd: 8.0}
      BR_calf_joint: {kp: 130.0, kd: 8.0}
      FL_calf_joint: {kp: 110.0, kd: 6.5}
      FR_calf_joint: {kp: 110.0, kd: 6.5}

  # These take over only after stand has settled and direct IMU stabilization
  # is explicitly enabled.
  leveling:
    hip:
      kp: 80.0
      kd: 2.0
    thigh:
      kp: 80.0
      kd: 2.0
    calf:
      kp: 80.0
      kd: 2.0

feedforward:
  tau_ff: 0.0
  v_des: 0.0

# Smooth gravity-support bias for loaded sit/stand. The Aug 5 19:07 loaded
# stand used only 35 Nm median / 46 Nm peak but retained 0.15-0.24 rad calf
# error. Add a small amount of support while staying well below the earlier
# 14-38 Nm map that distorted the pose. The remaining load stays with PD.
pose_support:
  enabled: true
  # Keep the calibrated gravity bias during zero-command policy takeover and
  # walking. This does not alter q_default or actor targets; it only prevents
  # the loaded 50 kg body support from vanishing when entry reaches 100%.
  policy_scale: 1.0
  stand_joint_tau_ff:
    BL_hip_joint: -1.30
    BR_hip_joint: 6.70
    FL_hip_joint: -1.83
    FR_hip_joint: -4.35
    BL_thigh_joint: 12.00
    BR_thigh_joint: -12.00
    FL_thigh_joint: 7.82
    FR_thigh_joint: -12.00
    BL_calf_joint: -12.00
    BR_calf_joint: 12.00
    FL_calf_joint: -8.00
    FR_calf_joint: 12.00

# Isaac/MuJoCo computes actuator torque from the raw policy target before the
# physical joint constraint is solved. On hardware we keep q_des inside the
# measured envelope and reproduce only that discarded position error as a
# bounded feedforward preload. The normal per-stage total torque limiter still
# applies after this contribution is added.
virtual_joint_stop:
  enabled: true
  # The model_11078 real run requested 26-45 Nm at the simulated calf stops.
  # Preserve that constraint reaction while the common total PD + damping +
  # feedforward estimator remains capped at 100 Nm.
  max_preload_nm: 50.0
