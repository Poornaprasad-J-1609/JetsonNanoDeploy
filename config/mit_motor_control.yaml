motor:
  model: rs-04
  use_official_mit_ranges: true

mit_protocol:
  # RobStride / CyberGear-style MIT control frame.
  # master_id is used only for filtering/diagnostics; operation-control
  # commands put feed-forward torque in the extended ID extra-data field.
  comm_type_mit_control: 1
  comm_type_feedback: 2
  comm_type_enable: 3
  comm_type_stop: 4
  comm_type_set_zero: 6
  comm_type_save_parameters: 22
  comm_type_active_feedback: 24
  # Host/controller ID used in RobStride management and polling frames.
  # This matches the working read_three_robstride_encoders.py script.
  master_id: 0xFD

  # Exact RS04 operation-control wire ranges from robstride_dynamics.
  p_min: -12.566370614359172
  p_max: 12.566370614359172
  v_min: -15.0
  v_max: 15.0
  kp_min: 0.0
  kp_max: 5000.0
  kd_min: 0.0
  kd_max: 100.0
  tau_min: -120.0
  tau_max: 120.0

startup:
  standup_seconds: 3.0

communication:
  # Legacy serial-AT adapters need paced frames. SocketCAN bypasses this delay
  # and submits each 12-motor command as one tightly grouped kernel CAN burst.
  batch_writes: false
  group_flush: true
  frame_gap_s: 0.0010

gains:
  # These are explicit RS04 gains in official SDK units. The pre-SocketCAN
  # deployment encoded 75/1.8 through 500/5 ranges; RS04 firmware interpreted
  # those same bits as approximately 750/36. Use those effective values here
  # so changing transport does not change actuator behavior.
  startup:
    hip:
      kp: 75
      kd: 1.8
    thigh:
      kp: 50.0
      kd: 1.8
    calf:
      kp: 75.0
      kd: 1.8

  hold:
    hip:
      kp: 75.0
      kd: 1.8
    thigh:
      kp: 50.0
      kd: 1.8
    calf:
      kp: 75.0
      kd: 1.8

  policy:
    hip:
      # Low suspended-test gains: enough to reveal the policy gait without
      # aggressively loading a joint when target tracking is imperfect.
      kp: 75.0
      kd: 1.8
    thigh:
      kp: 75.0
      kd: 1.8
    calf:
      kp: 75.0
      kd: 1.8

  # Direct IMU body-leveling gains. Stand-up itself continues to use the
  # startup gains above; these take over only after stand has settled.
  leveling:
    hip:
      kp: 75.0
      kd: 1.8
    thigh:
      kp: 75.0
      kd: 1.8
    calf:
      kp: 75.0
      kd: 1.8

feedforward:
  tau_ff: 0.0
  v_des: 0.0
