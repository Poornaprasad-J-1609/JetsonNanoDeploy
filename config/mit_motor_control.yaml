motor:
  model: rs-04
  use_official_mit_ranges: true
  # Use one physical RS04 unit contract in every phase. The legacy 9b03a77
  # range encoded Kp=75 and Kd=1.8 as approximately Kp=750 and Kd=36 when the
  # official motor decoded the packet, which caused pose vibration.
  command_encoding: official
  phase_command_encoding:
    startup: official
    hold: official
    policy: official
    leveling: official

legacy_command_protocol:
  use_float_to_uint: true
  p_min: -12.5
  p_max: 12.5
  v_min: -30.0
  v_max: 30.0
  kp_min: 0.0
  kp_max: 500.0
  kd_min: 0.0
  kd_max: 5.0
  tau_min: -12.0
  tau_max: 12.0

mit_protocol:
  # RobStride / CyberGear-style MIT control frame.
  # master_id is used only for filtering/diagnostics; operation-control
  # commands put feed-forward torque in the extended ID extra-data field.
  comm_type_mit_control: 1
  comm_type_feedback: 2
  comm_type_enable: 3
  comm_type_stop: 4
  comm_type_set_zero: 6
  comm_type_save_parameters: 22
  comm_type_active_feedback: 24
  # Host/controller ID used in RobStride management and polling frames.
  # This matches the working read_three_robstride_encoders.py script.
  master_id: 0xFD

  # Exact RS04 operation-control wire ranges from robstride_dynamics.
  p_min: -12.566370614359172
  p_max: 12.566370614359172
  v_min: -15.0
  v_max: 15.0
  kp_min: 0.0
  kp_max: 5000.0
  kd_min: 0.0
  kd_max: 100.0
  tau_min: -120.0
  tau_max: 120.0

startup:
  standup_seconds: 3.0

communication:
  # The old serial-AT backend uses this proven inter-packet gap. SocketCAN
  # bypasses it and lets the kernel serialize one compact 12-frame command set.
  batch_writes: false
  group_flush: true
  frame_gap_s: 0.0010

gains:
  # One physical RS04 gain pair per joint class, shared by startup, sit,
  # stand, hold, policy, and leveling. Requested tuning values; these differ
  # from model 8675's training gains and require hardware validation.
  hip:   {kp: 250.0, kd: 4.0}
  thigh: {kp: 250.0, kd: 4.0}
  calf:  {kp: 250.0, kd: 4.0}

feedforward:
  tau_ff: 0.0
  v_des: 0.0

# MEVIUS-style operation sends only q_des, zero qd_des, the configured gains,
# and zero feedforward. Gravity/load support therefore comes from impedance
# error exactly as it does in the upstream controller.
pose_support:
  enabled: false
  policy_scale: 0.0
  stand_joint_tau_ff: {}

# No software joint-stop torque is added. Physical target clamping remains the
# final protection against commands outside the measured joint envelope.
virtual_joint_stop:
  enabled: false
  max_preload_nm: 0.0
