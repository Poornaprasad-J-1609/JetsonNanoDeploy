motor:
  model: rs-04
  use_official_mit_ranges: true
  # Reproduce the operation-control bytes used by commit 9b03a77 while still
  # decoding feedback with the official RS04 ranges below. This preserves the
  # proven motor-side impedance across the serial-AT -> SocketCAN migration.
  command_encoding: legacy_9b03a77
  # Walking and policy-based IMU leveling use official RS04 units so the
  # configured/estimated Kp, Kd, velocity, and torque are the values decoded
  # by the motor. Startup and hold retain the proven legacy command bytes.
  phase_command_encoding:
    policy: official
    leveling: official

legacy_command_protocol:
  use_float_to_uint: true
  p_min: -12.5
  p_max: 12.5
  v_min: -30.0
  v_max: 30.0
  kp_min: 0.0
  kp_max: 500.0
  kd_min: 0.0
  kd_max: 5.0
  tau_min: -12.0
  tau_max: 12.0

mit_protocol:
  # RobStride / CyberGear-style MIT control frame.
  # master_id is used only for filtering/diagnostics; operation-control
  # commands put feed-forward torque in the extended ID extra-data field.
  comm_type_mit_control: 1
  comm_type_feedback: 2
  comm_type_enable: 3
  comm_type_stop: 4
  comm_type_set_zero: 6
  comm_type_save_parameters: 22
  comm_type_active_feedback: 24
  # Host/controller ID used in RobStride management and polling frames.
  # This matches the working read_three_robstride_encoders.py script.
  master_id: 0xFD

  # Exact RS04 operation-control wire ranges from robstride_dynamics.
  p_min: -12.566370614359172
  p_max: 12.566370614359172
  v_min: -15.0
  v_max: 15.0
  kp_min: 0.0
  kp_max: 5000.0
  kd_min: 0.0
  kd_max: 100.0
  tau_min: -120.0
  tau_max: 120.0

startup:
  standup_seconds: 3.0

communication:
  # The old serial-AT backend uses this proven inter-packet gap. SocketCAN
  # bypasses it and lets the kernel serialize one compact 12-frame command set.
  batch_writes: false
  group_flush: true
  frame_gap_s: 0.0010

gains:
  # Startup and hold keep the exact values/encoding used by the proven
  # pre-SocketCAN MIT path. Policy gains below are official motor-decoded units
  # identified from the supplied simulation torque logs.
  startup:
    hip:
      kp: 75
      kd: 1.8
    thigh:
      kp: 50.0
      kd: 1.8
    calf:
      kp: 75.0
      kd: 1.8

  hold:
    hip:
      kp: 75.0
      kd: 1.8
    thigh:
      kp: 50.0
      kd: 1.8
    calf:
      kp: 75.0
      kd: 1.8

  policy:
    hip:
      # Conservative real-hardware gains for initial walking tests. These are
      # official motor-decoded units; the independent torque ceiling remains
      # responsible for limiting peak effort.
      kp: 40.0
      kd: 2.0
    thigh:
      kp: 50.0
      kd: 2.5
    calf:
      kp: 50.0
      kd: 2.5
    joints:
      BL_hip_joint: {kp: 40.0, kd: 2.0}
      BR_hip_joint: {kp: 40.0, kd: 2.0}
      FL_hip_joint: {kp: 40.0, kd: 2.0}
      FR_hip_joint: {kp: 40.0, kd: 2.0}
      BL_thigh_joint: {kp: 50.0, kd: 2.5}
      BR_thigh_joint: {kp: 50.0, kd: 2.5}
      FL_thigh_joint: {kp: 50.0, kd: 2.5}
      FR_thigh_joint: {kp: 50.0, kd: 2.5}
      BL_calf_joint: {kp: 50.0, kd: 2.5}
      BR_calf_joint: {kp: 50.0, kd: 2.5}
      FL_calf_joint: {kp: 50.0, kd: 2.5}
      FR_calf_joint: {kp: 50.0, kd: 2.5}

  # Direct IMU body-leveling gains. Stand-up itself continues to use the
  # startup gains above; these take over only after stand has settled and
  # direct IMU stabilization is explicitly enabled. Keep enough stiffness to
  # support the robot instead of sagging under the leveling profile.
  leveling:
    hip:
      kp: 40.0
      kd: 2.0
    thigh:
      kp: 50.0
      kd: 2.5
    calf:
      kp: 50.0
      kd: 2.5

feedforward:
  tau_ff: 0.0
  v_des: 0.0
