motor:
  model: rs-04
  use_official_mit_ranges: true
  # Sit/stand/hold retain the exact legacy operation-control encoding from
  # e9a4a13, where loaded pose motion was proven strong and smooth. Policy and
  # leveling use official RS04 units independently.
  command_encoding: legacy_9b03a77
  phase_command_encoding:
    policy: official
    leveling: official

legacy_command_protocol:
  use_float_to_uint: true
  p_min: -12.5
  p_max: 12.5
  v_min: -30.0
  v_max: 30.0
  kp_min: 0.0
  kp_max: 500.0
  kd_min: 0.0
  kd_max: 5.0
  tau_min: -12.0
  tau_max: 12.0

mit_protocol:
  # RobStride / CyberGear-style MIT control frame.
  # master_id is used only for filtering/diagnostics; operation-control
  # commands put feed-forward torque in the extended ID extra-data field.
  comm_type_mit_control: 1
  comm_type_feedback: 2
  comm_type_enable: 3
  comm_type_stop: 4
  comm_type_set_zero: 6
  comm_type_save_parameters: 22
  comm_type_active_feedback: 24
  # Host/controller ID used in RobStride management and polling frames.
  # This matches the working read_three_robstride_encoders.py script.
  master_id: 0xFD

  # Exact RS04 operation-control wire ranges from robstride_dynamics.
  p_min: -12.566370614359172
  p_max: 12.566370614359172
  v_min: -15.0
  v_max: 15.0
  kp_min: 0.0
  kp_max: 5000.0
  kd_min: 0.0
  kd_max: 100.0
  tau_min: -120.0
  tau_max: 120.0

startup:
  standup_seconds: 3.0

communication:
  # The old serial-AT backend uses this proven inter-packet gap. SocketCAN
  # bypasses it and lets the kernel serialize one compact 12-frame command set.
  batch_writes: false
  group_flush: true
  frame_gap_s: 0.0010

gains:
  # Config-side values from the proven e9a4a13 sit/stand packet path.
  startup:
    hip:
      kp: 75.0
      kd: 1.8
    thigh:
      kp: 50.0
      kd: 1.8
    calf:
      kp: 75.0
      kd: 1.8

  hold:
    hip:
      kp: 75.0
      kd: 1.8
    thigh:
      kp: 50.0
      kd: 1.8
    calf:
      kp: 75.0
      kd: 1.8

  policy:
    hip:
      kp: 80.0
      kd: 2.0
    thigh:
      kp: 80.0
      kd: 2.0
    calf:
      kp: 80.0
      kd: 2.0
    joints:
      BL_hip_joint: {kp: 80.0, kd: 2.0}
      BR_hip_joint: {kp: 80.0, kd: 2.0}
      FL_hip_joint: {kp: 80.0, kd: 2.0}
      FR_hip_joint: {kp: 80.0, kd: 2.0}
      BL_thigh_joint: {kp: 80.0, kd: 2.0}
      BR_thigh_joint: {kp: 80.0, kd: 2.0}
      FL_thigh_joint: {kp: 80.0, kd: 2.0}
      FR_thigh_joint: {kp: 80.0, kd: 2.0}
      BL_calf_joint: {kp: 80.0, kd: 2.0}
      BR_calf_joint: {kp: 80.0, kd: 2.0}
      FL_calf_joint: {kp: 80.0, kd: 2.0}
      FR_calf_joint: {kp: 80.0, kd: 2.0}

  # These take over only after stand has settled and direct IMU stabilization
  # is explicitly enabled.
  leveling:
    hip:
      kp: 80.0
      kd: 2.0
    thigh:
      kp: 80.0
      kd: 2.0
    calf:
      kp: 80.0
      kd: 2.0

feedforward:
  tau_ff: 0.0
  v_des: 0.0

# Isaac/MuJoCo computes actuator torque from the raw policy target before the
# physical joint constraint is solved. On hardware we keep q_des inside the
# measured envelope and reproduce only that discarded position error as a
# bounded feedforward preload. The normal per-stage total torque limiter still
# applies after this contribution is added.
virtual_joint_stop:
  enabled: true
  max_preload_nm: 8.0
