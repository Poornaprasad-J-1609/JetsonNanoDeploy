# Emergency-stop thresholds.
#
# Per-joint position and rate limits now live in:
#   config/joint_limits.yaml

emergency:
  # Upright projected_gravity.z is -1.0. The controller stops when z rises
  # above this value. -0.75 allowed about 41 deg tilt; -0.25 allows about
  # 75 deg, roughly 3x the previous gravity-z deviation from upright.
  projected_gravity_gz_min: -0.25
  max_body_ang_vel_norm: 8.0

# Live encoder sanity checks. These are checked before sit, stand, and walking
# commands are generated. In MIT feedback mode, active joints must report live
# encoder values before motion starts.
encoder:
  enabled: true

  # Stops immediately if an active joint has no MIT feedback before motion.
  # This is ignored for fake-feedback dry runs.
  require_feedback_for_motion: true

  # Once motion is active, each active motor must keep replying. 0.50 s avoids
  # false stops from serial USB-CAN jitter on 12 motors while still catching a
  # real cable/adapter/motor dropout quickly.
  max_feedback_age_s: 0.50

  # Absolute sanity limit after persistent motor zero, configured offset, and
  # motor-direction conversion. No host-side 2*pi conversion is performed.
  max_abs_position_rad: 2.0

  # Also stop if measured q is outside config/joint_limits.yaml by this margin.
  # This catches bad zero positions before they become violent motion commands.
  # The margin permits normal tracking error/overshoot while still stopping
  # before the motor runs far past the URDF-like software stop.
  joint_limit_margin_rad: 0.30

  # Ground-test guard for measured MIT torque feedback. A 47 kg robot can show
  # 60-80 Nm support/load-transfer torque at a calf without that being a fault.
  # Keep this below the RS04 wire range (+/-120 Nm) and use the CLI
  # --policy-pd-torque-limit to limit commanded walking effort.
  max_abs_torque: 95.0
  # Require this many consecutive over-limit feedback samples before stopping.
  # Set to 1 for immediate trips. 2 filters a single noisy feedback packet
  # while still stopping a real overload on the next control cycle.
  max_abs_torque_fault_samples: 2

  report_max_joints: 4
