policy_torque_profile:
  # High-authority suspended qualification profile. This is an upper bound,
  # not a continuous torque command. The existing ramp supervisor controls
  # progression from the initial to final per-joint authority.
  start_nm:
    BL_hip_joint: 14.0
    BR_hip_joint: 14.0
    FL_hip_joint: 14.0
    FR_hip_joint: 14.0
    BL_thigh_joint: 14.0
    BR_thigh_joint: 14.0
    FL_thigh_joint: 14.0
    FR_thigh_joint: 14.0
    BL_calf_joint: 14.0
    BR_calf_joint: 14.0
    FL_calf_joint: 14.0
    FR_calf_joint: 14.0

  final_nm:
    BL_hip_joint: 100.0
    BR_hip_joint: 100.0
    FL_hip_joint: 100.0
    FR_hip_joint: 100.0
    BL_thigh_joint: 100.0
    BR_thigh_joint: 100.0
    FL_thigh_joint: 100.0
    FR_thigh_joint: 100.0
    BL_calf_joint: 100.0
    BR_calf_joint: 100.0
    FL_calf_joint: 100.0
    FR_calf_joint: 100.0
