policy_torque_profile:
  # The loaded stand-to-policy transition needs materially more support than
  # the old uniform 14 Nm entry stage. July 31 telemetry showed that the
  # previous 24 -> 30 Nm ramp never advanced, while 57-68% of sagittal packets
  # were torque-limited and joint speed stayed below simulation. Keep hip
  # authority conservative because the FR hip reached its physical boundary.
  start_nm:
    BL_hip_joint: 18.0
    BR_hip_joint: 18.0
    FL_hip_joint: 18.0
    FR_hip_joint: 18.0
    BL_thigh_joint: 30.0
    BR_thigh_joint: 30.0
    FL_thigh_joint: 30.0
    FR_thigh_joint: 30.0
    BL_calf_joint: 30.0
    BR_calf_joint: 30.0
    FL_calf_joint: 30.0
    FR_calf_joint: 30.0

  final_nm:
    BL_hip_joint: 18.0
    BR_hip_joint: 18.0
    FL_hip_joint: 18.0
    FR_hip_joint: 18.0
    BL_thigh_joint: 30.0
    BR_thigh_joint: 30.0
    FL_thigh_joint: 30.0
    FR_thigh_joint: 30.0
    BL_calf_joint: 30.0
    BR_calf_joint: 30.0
    FL_calf_joint: 30.0
    FR_calf_joint: 30.0
