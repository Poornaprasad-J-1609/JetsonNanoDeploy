policy_contract:
  schema_version: 1

  artifact:
    source_checkpoint: policy/policy.pt
    source_checkpoint_sha256: 48b3d7c7e10fd0d27a053fdf3af56bcd9190481c35798b585f0a0ff0478cf8b3
    deployment_actor: policy/model_12357_actor.pt
    sha256: 139dc25e7ad44628cebfea12e96095781d8fc8e070d4419487dfb88a240f79d3
    format: torchscript
    observation_dim: 48
    action_dim: 12
    deterministic_actor_only: true
    actor_export_verified: true
    export_comparison_cases: 2048
    export_maximum_absolute_error: 0.0
    invalid_observation_widths_rejected: [34, 45]
    dtype: float32

  # The checkpoint contains tensor shapes and weights, but no observation
  # names, clock definition, joint names, action scales, or reset semantics.
  # Keep hardware blocked until these values are copied from the exact
  # model_12357 Isaac environment/export source and verified with golden data.
  semantic_contract:
    verified: false
    training_source_path:
    golden_vectors_path:

    observation:
      prefix_name: marching_clock
      prefix_indices: [0, 1, 2]
      clock_formula_verified: false
      clock_provider_implemented: false
      clock_frequency_hz:
      clock_reset_rule:
      base_ang_vel_indices: [3, 4, 5]
      projected_gravity_indices: [6, 7, 8]
      command_indices: [9, 10, 11]
      joint_position_indices: [12, 23]
      joint_velocity_indices: [24, 35]
      previous_action_indices: [36, 47]
      stationary_command: [0.0, 0.0, 0.0]
      stationary_command_enforced: true
      previous_action_convention:
      previous_action_convention_verified: false

    joint_order:
      # Current deployment candidate only. This is not encoded in the actor.
      names:
        - BL_hip_joint
        - BR_hip_joint
        - FL_hip_joint
        - FR_hip_joint
        - BL_thigh_joint
        - BR_thigh_joint
        - FL_thigh_joint
        - FR_thigh_joint
        - BL_calf_joint
        - BR_calf_joint
        - FL_calf_joint
        - FR_calf_joint
      verified_from_training: false
      position_velocity_signs_verified_from_training: false

    action:
      clip_candidate: [-1.0, 1.0]
      clip_verified_from_training: false
      # Supplied as a candidate per-leg/interleaved convention. It conflicts
      # with the supplied grouped-by-joint motor-ID candidate, so it must not
      # be activated until the exact Isaac action joint order is exported.
      scale_candidate:
        [-0.25, -0.40, 0.40, -0.25, -0.40, 0.40,
         -0.25, -0.40, 0.40, -0.25, -0.40, 0.40]
      scale_verified_from_training: false
      per_index_action_pipeline_implemented: false
      q_default_verified_from_training: false
      initial_hardware_gain: 0.05

    timing:
      policy_rate_hz: 50
      low_level_rate_hz: 200
      target_interpolation:
      target_interpolation_verified_from_training: false

  hardware_contract:
    verified: false
    policy_to_motor_mapping_verified: false
    encoder_zero_and_sign_verified: false
    joint_limits_verified: false
    four_bar_required: true
    four_bar_calibration_verified: false
    imu_frame_verified: false
    imu_rate_and_timestamp_verified: false
    effective_joint_gains_verified: false
    torque_current_conversion_verified: false
    battery_voltage_monitor_verified: false
    thermal_limits_verified: false
    low_level_timing_verified: false
    safety_state_machine_verified: false
    current_measurement_and_logging_verified: false
    battery_measurement_and_logging_verified: false
    sustained_saturation_watchdog_verified: false
    unexpected_motor_id_watchdog_verified: false

    # Candidate runtime values from the supplied specification. Null fields
    # are intentionally unresolved and must be measured before approval.
    initial_limits:
      imu_stale_timeout_s: 0.10
      max_abs_roll_pitch_deg: 15.0
      four_bar_min_abs_jacobian: 0.05
      four_bar_endpoint_tolerance_rad: 0.01
      suspended_policy_action_gain: 0.05
      suspended_torque_limit_nm: [20.0, 30.0]
      supported_stand_torque_limit_nm: [60.0, 80.0]
      battery_undervoltage_v:
      motor_overtemperature_c:
      continuous_current_a:
      peak_current_a:
      peak_current_duration_s:

    measured_values:
      robot_mass_kg:
      battery_voltage_nominal_v:
      policy_inference_p99_ms:
      low_level_jitter_p99_ms:
      sensor_to_actuator_latency_p99_ms:
      imu_fresh_rate_hz:
      maximum_encoder_age_ms:

  hardware_enable_permitted: false
