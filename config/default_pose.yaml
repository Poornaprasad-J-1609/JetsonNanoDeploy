# The RobStride hardware zero is set with the robot physically standing.
# Sit/stand and the validated locomotion policy therefore share that exact
# all-zero stand frame. Do not add a calf offset here: it deliberately folds
# the legs before load-induced tracking error is considered.
# All values in this file use IsaacSim/URDF joint coordinates. Do not manually
# invert hip or thigh signs here: config/motor_directions.yaml converts between
# these policy coordinates and the real encoder/motor convention.
default_pose:
  BL_hip_joint: 0.0
  BR_hip_joint: 0.0
  FL_hip_joint: 0.0
  FR_hip_joint: 0.0

  BL_thigh_joint: 0.0
  BR_thigh_joint: 0.0
  FL_thigh_joint: 0.0
  FR_thigh_joint: 0.0

  BL_calf_joint: 0.0
  BR_calf_joint: 0.0
  FL_calf_joint: 0.0
  FR_calf_joint: 0.0

stand_pose:
  BL_hip_joint: 0.0
  BR_hip_joint: 0.0
  FL_hip_joint: 0.0
  FR_hip_joint: 0.0

  BL_thigh_joint: 0.0
  BR_thigh_joint: 0.0
  FL_thigh_joint: 0.0
  FR_thigh_joint: 0.0

  BL_calf_joint: 0.0
  BR_calf_joint: 0.0
  FL_calf_joint: 0.0
  FR_calf_joint: 0.0

crouch_pose:
  BL_hip_joint: 0.0
  BR_hip_joint: 0.0
  FL_hip_joint: 0.0
  FR_hip_joint: 0.0

  BL_thigh_joint: 0.65
  BR_thigh_joint: -0.65
  FL_thigh_joint: 0.65
  FR_thigh_joint: -0.65

  BL_calf_joint: 1.35
  BR_calf_joint: -1.35
  FL_calf_joint: 1.35
  FR_calf_joint: -1.35
