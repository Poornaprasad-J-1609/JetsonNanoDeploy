# The RobStride hardware zero is set once with the robot physically standing.
# RL default and stand therefore stay exactly zero. Edit only crouch_pose to
# tune the keyboard C target in this fixed stand-zero coordinate frame.
# All values in this file use IsaacSim/URDF joint coordinates. Do not manually
# invert hip or thigh signs here: config/motor_directions.yaml converts between
# these policy coordinates and the real encoder/motor convention.
default_pose:
  BL_hip_joint: 0.0
  BR_hip_joint: 0.0
  FL_hip_joint: 0.0
  FR_hip_joint: 0.0

  BL_thigh_joint: 0.0
  BR_thigh_joint: 0.0
  FL_thigh_joint: 0.0
  FR_thigh_joint: 0.0

  BL_calf_joint: 0.0
  BR_calf_joint: 0.0
  FL_calf_joint: 0.0
  FR_calf_joint: 0.0

stand_pose:
  BL_hip_joint: 0.0
  BR_hip_joint: 0.0
  FL_hip_joint: 0.0
  FR_hip_joint: 0.0

  BL_thigh_joint: 0.0
  BR_thigh_joint: 0.0
  FL_thigh_joint: 0.0
  FR_thigh_joint: 0.0

  BL_calf_joint: 0.0
  BR_calf_joint: 0.0
  FL_calf_joint: 0.0
  FR_calf_joint: 0.0

crouch_pose:
  BL_hip_joint: 0.0
  BR_hip_joint: 0.0
  FL_hip_joint: 0.0
  FR_hip_joint: 0.0

  BL_thigh_joint: 0.50
  BR_thigh_joint: -0.50
  FL_thigh_joint: 0.50
  FR_thigh_joint: -0.50

  BL_calf_joint: 1.64
  BR_calf_joint: -1.64
  FL_calf_joint: 1.64
  FR_calf_joint: -1.64
