# Joint safety limits in radians.
#
# Edit this file to tune per-joint command limits. The controller clips every
# policy, sit, and stand target through these limits before MIT packets are sent.
#
# dq_max_per_step is the maximum target change per 20 ms control step by default
# because config/joint_map.yaml currently sets control_dt: 0.02.
# These values are target slew limits, not hard joint angles. Hard angle limits
# below are still always applied before MIT packets are sent.
#
# Walking-test defaults:
#   0.080 rad/step = 4.00 rad/s at 50 Hz.
# Increase per-joint values only after the robot moves smoothly and all
# encoder directions/limits are verified on hardware.

joint_limits:
  FL_hip_joint:
    min: -2.0
    max: 2.0
    dq_max_per_step: 0.040
  FR_hip_joint:
    min: -2.0
    max: 2.0
    dq_max_per_step: 0.040
  BL_hip_joint:
    min: -2.0
    max: 2.0
    dq_max_per_step: 0.040
  BR_hip_joint:
    min: -2.0
    max: 2.0
    dq_max_per_step: 0.040

  FL_thigh_joint:
    min: -3.0
    max: 3.0
    dq_max_per_step: 0.040
  FR_thigh_joint:
    min: -3.0
    max: 3.0
    dq_max_per_step: 0.040
  BL_thigh_joint:
    min: -3.0
    max: 3.0
    dq_max_per_step: 0.040
  BR_thigh_joint:
    min: -3.0
    max: 3.0
    dq_max_per_step: 0.040

  FL_calf_joint:
    min: -2.0
    max: 2.0
    dq_max_per_step: 0.040
  FR_calf_joint:
    min: -2.0
    max: 2.0
    dq_max_per_step: 0.040
  BL_calf_joint:
    min: -2.0
    max: 2.0
    dq_max_per_step: 0.040
  BR_calf_joint:
    min: -2.0
    max: 2.0
    dq_max_per_step: 0.040
