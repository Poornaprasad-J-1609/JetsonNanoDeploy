  FL_calf_joint:
    min: 0.0
    max: 1.16
    # Allow only a small policy over-target past the hard stop side. The sim
    # actuator can ask beyond the stop while the simulated joint remains
    # clamped; the real motor has to be bounded before safety trips.
    policy_min: 0.0
    policy_max: 1.16
    dq_max_per_step: 0.080
  FR_calf_joint:
    min: -1.16
    max: 0.0
