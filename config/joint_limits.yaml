# Joint safety limits in radians.
#
# Edit this file to tune per-joint command limits. The controller clips every
# policy, sit, and stand target through these limits before MIT packets are sent.
#
# dq_max_per_step is the maximum target change per 20 ms control step by default
# because config/joint_map.yaml currently sets control_dt: 0.02.
# These values are target slew limits, not hard joint angles. Hard angle limits
# below are still always applied before MIT packets are sent.
#
# Fast sit/stand/keyboard-control testing defaults:
#   hip   0.040 rad/step = 2.00 rad/s
#   thigh 0.060 rad/step = 3.00 rad/s
#   calf  0.070 rad/step = 3.50 rad/s

joint_limits:
  FL_hip_joint:
    min: -2.0
    max: 2.0
    dq_max_per_step: 0.040
  FR_hip_joint:
    min: -2.0
    max: 2.0
    dq_max_per_step: 0.040
  BL_hip_joint:
    min: -0.35
    max: 0.35
    dq_max_per_step: 0.040
  BR_hip_joint:
    min: -0.35
    max: 0.35
    dq_max_per_step: 0.040

  FL_thigh_joint:
    min: -3.0
    max: 3.0
    dq_max_per_step: 0.060
  FR_thigh_joint:
    min: -3.0
    max: 3.0
    dq_max_per_step: 0.060
  BL_thigh_joint:
    min: -1.2
    max: 1.2
    dq_max_per_step: 0.060
  BR_thigh_joint:
    min: -1.2
    max: 1.2
    dq_max_per_step: 0.060

  FL_calf_joint:
    min: -2.0
    max: 2.0
    dq_max_per_step: 0.070
  FR_calf_joint:
    min: -2.0
    max: 2.0
    dq_max_per_step: 0.070
  BL_calf_joint:
    min: -1.2
    max: 1.42
    dq_max_per_step: 0.070
  BR_calf_joint:
    min: -1.42
    max: 1.2
    dq_max_per_step: 0.070
