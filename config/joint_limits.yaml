  FL_calf_joint:
    min: 0.0
    max: 1.36
    # IsaacSim's actuator is allowed to request PD targets beyond the
    # articulation stop while the simulated joint itself remains bounded.
    # Keep sit/crouch hard limits signed, but let policy targets use the full
    # direct motor range so calf gait is not flattened to zero.
    policy_min: 0.0
    policy_max: 1.36
    dq_max_per_step: 0.080
  FR_calf_joint:
    min: -1.36
    max: 0.0
    policy_min: -1.36
    policy_max: 0
    dq_max_per_step: 0.080
  BL_calf_joint:
    min: 0.0
    max: 1.36
    policy_min: 0
    policy_max: 1.36
    dq_max_per_step: 0.080
  BR_calf_joint:
    min: -1.36
    max: 0.0
    policy_min: -1.36
    policy_max: 0
    dq_max_per_step: 0.080
