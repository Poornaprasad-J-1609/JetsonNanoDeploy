# Dedicated loaded-robot sit/stand tuning profile.
#
# The controller uses the same production MIT impedance equation:
#   tau_est = Kp * (q_des - q_measured)
#           + Kd * (qd_des - qd_measured)
#           + tau_ff
# During both transitions and settled pose hold, qd_des and tau_ff are exactly
# zero. The RS04 therefore applies Kp*(q_des-q)-Kd*qdot internally. Physical
# joint limits, feedback freshness, temperature/fault, tilt, and absolute
# torque safety remain active. Policy inference and walking are disabled by
# scripts/run_sit_stand_gain_test.sh.
sit_stand_gain_test:
  # Total estimated PD + damping + feedforward ceiling for every joint.
  # This is a limit, not a commanded torque. Do not exceed the RS04 120 Nm
  # protocol range. Review motor temperature between loaded tests.
  torque_limit_nm: 100.0

  gains:
    sit:
      hip:   {kp: 250.0, kd: 4.0}
      thigh: {kp: 250.0, kd: 4.0}
      calf:  {kp: 250.0, kd: 4.0}
      joints: {}

    stand:
      # The physical stand target is the calibrated all-zero hardware frame.
      hip:   {kp: 250.0, kd: 4.0}
      thigh: {kp: 250.0, kd: 4.0}
      calf:  {kp: 250.0, kd: 4.0}
      joints: {}

  # Optional per-joint syntax under either phase:
  # joints:
  #   BL_calf_joint: {kp: 120.0, kd: 3.5}
