# Joystick walking direction control

axes:
  # left stick Y -> forward/backward
  vx_axis: 1

  # left stick X -> left/right
  vy_axis: 0

  # right stick X -> turning/yaw
  # Logitech RumblePad/F710-style controllers usually expose this as axis 2.
  yaw_axis: 2

invert:
  # Many controllers give left-stick-up as -1, so vx is usually inverted.
  vx: true
  # Isaac keyboard convention: A/left is +Y, D/right is -Y.
  # Most joystick X axes report left=-1 and right=+1, so invert this axis.
  vy: true
  # Isaac keyboard convention: Q/left turn is +yaw, E/right turn is -yaw.
  # Most joystick X axes report left=-1 and right=+1, so invert this axis.
  yaw: true

speed_limits:
  # Full-stick command before runtime speed_scale is applied.
  # These match play_grallator_keyboard.py:
  #   W/S -> +/-1.8 vx, A/D -> +/-0.8 vy, Q/E -> +/-0.7 yaw.
  # Runtime speed_scale remains low in control_limits.yaml for safe tests.
  max_vx: 1.80
  max_vy: 0.80
  max_yaw: 0.70

filter:
  deadzone: 0.08
  expo: 0.35
  smoothing: 0.20
  # Keep D-pad reserved for software zero calibration. Movement uses sticks.
  use_hat_fallback: false

connection:
  # Wait briefly for wireless receivers/controllers to enumerate.
  wait_seconds: 5.0

buttons:
  # Button 5 moves to stand pose.
  stand: 5
  policy: -1

  # Button 4 stops walking policy and moves to crouch/sit pose.
  sit: 4

  # Buttons 0-3 emergency-stop. Ctrl+C is also always available.
  emergency_stop: [0, 1, 2, 3]

  # Optional joystick speed scale buttons.
  speed_down: 6
  speed_up: 7

  # Optional physical button for software zero calibration. -1 disables it.
  zero_calibration: -1

dpad:
  # D-pad/hat direction that saves the current crouch/default pose as software
  # zero. This is software-only; it does not send a RobStride hardware set-zero.
  # Default is D-pad down on Logitech-style controllers.
  zero_calibration_hat_index: 0
  zero_calibration_hat_direction: [0, -1]
  # Use only the configured D-pad direction for zeroing. This avoids accidental
  # recalibration from other D-pad directions.
  zero_calibration_hat_any: false

  # Keep this disabled during walking: axis 1 is also the forward/back stick on
  # the F710, so using it as zero-calibration can accidentally recalibrate while
  # commanding motion. D-pad/hat zero remains enabled above.
  zero_calibration_axis: -1
  zero_calibration_axis_direction: 1.0
  zero_calibration_axis_threshold: 0.8
  zero_calibration_cooldown_s: 1.0
