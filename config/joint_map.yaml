control_dt: 0.02
# Legacy scalar candidate from the previous locomotion actor. model_12357's
# per-index scale must be copied from its exact Isaac action configuration
# before policy-controlled motor enable is permitted.
policy_action_scale: 0.25

# Policy output/observation joint order.
#
# Deployment candidate only. The checkpoint has no semantic joint names. Keep
# hardware blocked until this order is exported from model_12357's environment.
policy_to_real_order:
  - BL_hip_joint
  - BR_hip_joint
  - FL_hip_joint
  - FR_hip_joint
  - BL_thigh_joint
  - BR_thigh_joint
  - FL_thigh_joint
  - FR_thigh_joint
  - BL_calf_joint
  - BR_calf_joint
  - FL_calf_joint
  - FR_calf_joint

# Optional sign transform between the policy coordinate convention and the
# deployment/sit-stand joint coordinate convention. Keep these signs in the
# Isaac/URDF policy coordinate frame. Real encoder/motor clockwise-vs-
# anticlockwise polarity is handled separately in config/motor_directions.yaml.
policy_joint_signs:
  BL_hip_joint: 1
  BR_hip_joint: 1
  FL_hip_joint: 1
  FR_hip_joint: 1
  BL_thigh_joint: 1
  BR_thigh_joint: 1
  FL_thigh_joint: 1
  FR_thigh_joint: 1
  BL_calf_joint: 1
  BR_calf_joint: 1
  FL_calf_joint: 1
  FR_calf_joint: 1

observation_layout:
  marching_clock: [0, 1, 2]
  base_ang_vel: [3, 4, 5]
  projected_gravity: [6, 7, 8]
  command: [9, 10, 11]
  joint_pos_relative: [12, 23]
  joint_vel: [24, 35]
  previous_action: [36, 47]

command_limits:
  # Fallback command limits when config/control_limits.yaml disables its
  # velocity_command section. Keep these aligned with play_grallator_keyboard.py.
  vx_min: -1.80
  vx_max: 1.80
  vy_min: -0.80
  vy_max: 0.80
  yaw_min: -0.80
  yaw_max: 0.80
