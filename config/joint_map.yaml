control_dt: 0.02
# Legacy scalar retained for older analysis tools. model_12357 uses the
# explicit signed per-joint scales below for motor targets.
policy_action_scale: 0.25

policy_contract:
  autonomous_march: true
  marching_clock_frequency_hz: 0.80
  marching_clock_formula: sin_cos_one
  command: [0.0, 0.0, 0.0]

# Signed JointPositionAction scales from the marching task. These are listed by
# actor joint name so the grouped policy order cannot be confused with a
# per-leg/interleaved order.
policy_action_scales:
  BL_hip_joint: -0.25
  BR_hip_joint: -0.25
  FL_hip_joint: -0.25
  FR_hip_joint: -0.25
  BL_thigh_joint: -0.40
  BR_thigh_joint: -0.40
  FL_thigh_joint: -0.40
  FR_thigh_joint: -0.40
  BL_calf_joint: 0.40
  BR_calf_joint: 0.40
  FL_calf_joint: 0.40
  FR_calf_joint: 0.40

# Policy output/observation joint order.
#
# Verified against the Isaac/MuJoCo policy observation and action schema. Keep
# this in actor order; name-based routing handles the different motor-ID order.
policy_to_real_order:
  - BL_hip_joint
  - BR_hip_joint
  - FL_hip_joint
  - FR_hip_joint
  - BL_thigh_joint
  - BR_thigh_joint
  - FL_thigh_joint
  - FR_thigh_joint
  - BL_calf_joint
  - BR_calf_joint
  - FL_calf_joint
  - FR_calf_joint

# Optional sign transform between the policy coordinate convention and the
# deployment/sit-stand joint coordinate convention. Keep these signs in the
# Isaac/URDF policy coordinate frame. Real encoder/motor clockwise-vs-
# anticlockwise polarity is handled separately in config/motor_directions.yaml.
policy_joint_signs:
  BL_hip_joint: 1
  BR_hip_joint: 1
  FL_hip_joint: 1
  FR_hip_joint: 1
  BL_thigh_joint: 1
  BR_thigh_joint: 1
  FL_thigh_joint: 1
  FR_thigh_joint: 1
  BL_calf_joint: 1
  BR_calf_joint: 1
  FL_calf_joint: 1
  FR_calf_joint: 1

observation_layout:
  marching_clock: [0, 1, 2]
  base_ang_vel: [3, 4, 5]
  projected_gravity: [6, 7, 8]
  command: [9, 10, 11]
  joint_pos_relative: [12, 23]
  joint_vel: [24, 35]
  previous_action: [36, 47]

command_limits:
  # Fallback command limits when config/control_limits.yaml disables its
  # velocity_command section. Keep these aligned with play_grallator_keyboard.py.
  vx_min: -1.80
  vx_max: 1.80
  vy_min: -0.80
  vy_max: 0.80
  yaw_min: -0.80
  yaw_max: 0.80
