control_dt: 0.02
# Must match the JointPositionAction scale used during policy training.
# The current grallator flat/rough configs use 0.25. Lower this only for
# intentionally softened first-contact tests.
policy_action_scale: 0.25

# Deployment contract for policy/policy.pt. The exported TorchScript module has
# an Identity observation normalizer, so these values are fed directly to the
# actor. Keep the scales at 1.0 unless the training environment explicitly set
# an ObsTerm scale.
policy_contract:
  observation_dim: 48
  action_dim: 12
  action_joint_order:
    - BL_hip_joint
    - BR_hip_joint
    - FL_hip_joint
    - FR_hip_joint
    - BL_thigh_joint
    - BR_thigh_joint
    - FL_thigh_joint
    - FR_thigh_joint
    - BL_calf_joint
    - BR_calf_joint
    - FL_calf_joint
    - FR_calf_joint
  force_zero_base_linear_velocity: true
  normalize_projected_gravity: true
  observation_scales:
    base_lin_vel: 1.0
    base_ang_vel: 1.0
    projected_gravity: 1.0
    command: 1.0
    joint_pos_relative: 1.0
    joint_vel: 1.0
    previous_action: 1.0

# Policy output/observation joint order.
#
# This is the native IsaacLab articulation order printed by the simulation
# telemetry used to export policy.pt. JointPositionActionCfg and joint_pos_rel /
# joint_vel_rel all use this same order when preserve_order is false.
policy_to_real_order:
  - BL_hip_joint
  - BR_hip_joint
  - FL_hip_joint
  - FR_hip_joint
  - BL_thigh_joint
  - BR_thigh_joint
  - FL_thigh_joint
  - FR_thigh_joint
  - BL_calf_joint
  - BR_calf_joint
  - FL_calf_joint
  - FR_calf_joint

observation_layout:
  base_lin_vel: [0, 1, 2]
  base_ang_vel: [3, 4, 5]
  projected_gravity: [6, 7, 8]
  command: [9, 10, 11]
  joint_pos_relative: [12, 23]
  joint_vel: [24, 35]
  previous_action: [36, 47]

command_limits:
  # Fallback command limits when config/control_limits.yaml disables its
  # velocity_command section. Keep these aligned with play_grallator_keyboard.py.
  vx_min: -2.20
  vx_max: 2.20
  vy_min: -1.20
  vy_max: 1.20
  yaw_min: -0.70
  yaw_max: 0.70
