motor:
  model: rs-04
  id: 1
  interface: slcan0
  bitrate: 1000000
  feedback_timeout_s: 0.10
  torque_feedback_source: rs04_mit_feedback
  current_source: unavailable
  voltage_source: unavailable
  torque_constant_nm_per_a: null

control:
  frequency_hz: 200.0
  gui_frequency_hz: 25.0
  initial_kp: 40.0
  initial_kd: 2.0
  kp_min: 0.0
  kp_max: 500.0
  kd_min: 0.0
  kd_max: 10.0
  tau_ff_min_nm: -20.0
  tau_ff_max_nm: 20.0
  manual_step_rad: 0.017453292519943295
  manual_speed_rad_s: 0.25

safety:
  min_position_rad: -2.5
  max_position_rad: 2.5
  max_velocity_rad_s: 8.0
  max_torque_nm: 40.0
  max_current_a: 30.0
  max_temperature_c: 70.0
  communication_timeout_s: 0.10
  feedback_timeout_s: 0.10
  max_consecutive_late_cycles: 10

logging:
  directory: logs/rs04_bench
  queue_size: 20000
  flush_interval_s: 0.5

analysis:
  filter_window: 21
  filter_polynomial_order: 3
  velocity_deadband_rad_s: 0.03
  minimum_identification_samples: 200
  minimum_excitation_velocity_rad_s: 0.15
  settling_band_fraction: 0.02

pendulum:
  attached_mass_kg: 0.0
  mass_com_radius_m: 0.0
  lever_mass_kg: 0.0
  lever_com_radius_m: 0.0
  known_lever_inertia_kg_m2: 0.0
  gravity_m_s2: 9.80665
  angle_zero_convention: downward_vertical

mock:
  inertia_kg_m2: 0.020
  viscous_damping_nm_s_rad: 0.12
  coulomb_friction_nm: 0.15
  command_delay_s: 0.010
  torque_limit_nm: 40.0
  initial_temperature_c: 28.0
